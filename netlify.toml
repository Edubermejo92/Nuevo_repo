# Cat Health Tracker — configuración de Netlify
#
# Solo se publica lo que forma la app; el README y las migraciones de
# Supabase se quedan fuera. Las cabeceras y las rutas viven en _headers y
# _redirects, que genera build.sh, para que el comportamiento sea el mismo
# tanto en un despliegue desde git como arrastrando la carpeta a mano.

[build]
  publish = "dist"
  command = "bash build.sh"
